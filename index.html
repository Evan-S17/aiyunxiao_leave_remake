<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>请假记录</title>
  </head>
  <body>
    <div class="phone">
      <header class="app-header">
        <div class="status-bar" aria-hidden="true">
          <span class="clock">12:22</span>
          <div class="device-status">
            <svg class="signal" viewBox="0 0 20 14"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="15" width="3" height="14" rx="1"/></svg>
            <svg class="wifi" viewBox="0 0 22 17"><path d="M2 5Q11-2 20 5M5 9Q11 4 17 9M8 13Q11 10 14 13"/><circle cx="11" cy="16" r="1"/></svg>
            <span class="battery">59</span>
          </div>
        </div>
        <nav class="navigation" aria-label="页面导航">
          <div class="navigation-left"><button class="icon-button back" aria-label="返回"><svg viewBox="0 0 24 24"><path d="m15 4-8 8 8 8"/></svg></button><button class="icon-button close-page" aria-label="关闭搜索和筛选"><svg viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></svg></button></div>
          <h1>请假记录</h1>
          <button class="icon-button more" aria-label="更多操作"><svg viewBox="0 0 30 20"><circle cx="5" cy="10" r="2"/><circle cx="15" cy="10" r="2"/><circle cx="25" cy="10" r="2"/></svg></button>
        </nav>
        <form class="search-bar" id="search-form" role="search">
          <div class="search-field"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="m12.5 12.5 5 5"/></svg><input id="search-name" type="search" placeholder="学生姓名" aria-label="学生姓名" autocomplete="off"/><button type="button" class="clear-search" aria-label="清空姓名">×</button></div>
          <button class="green-button search-button" type="submit">搜索</button>
          <button class="green-button filter-button" id="open-filter" type="button">筛选<span class="filter-dot" hidden></span></button>
        </form>
      </header>
      <main id="records" class="records" aria-label="请假记录列表"></main>
      <div class="bottom-safe-area" aria-hidden="true"></div>
    </div>
    <dialog id="panel" class="panel" aria-labelledby="panel-title"><div id="panel-content"></div></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
