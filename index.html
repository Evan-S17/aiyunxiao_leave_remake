<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>请假记录</title>
  </head>
  <body>
    <div class="phone">
      <header class="app-header">
        <nav class="navigation" aria-label="页面导航">
          <div class="navigation-left"><button class="icon-button back" aria-label="返回"><svg viewBox="0 0 24 24"><path d="m15 4-8 8 8 8"/></svg></button></div>
          <h1>请假记录</h1>
          <button class="icon-button more" aria-label="更多操作"><svg viewBox="0 0 30 20"><circle cx="5" cy="10" r="2"/><circle cx="15" cy="10" r="2"/><circle cx="25" cy="10" r="2"/></svg></button>
        </nav>
        <form class="search-bar" id="search-form" role="search">
          <div class="search-field"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="m12.5 12.5 5 5"/></svg><input id="search-name" type="search" placeholder="学生姓名" aria-label="学生姓名" autocomplete="off"/><button type="button" class="clear-search" aria-label="清空姓名">×</button></div>
          <button class="green-button search-button" type="submit">搜索</button>
          <button class="green-button filter-button" id="open-filter" type="button">筛选<span class="filter-dot" hidden></span></button>
        </form>
      </header>
      <main id="records" class="records" aria-label="请假记录列表"></main>
    </div>
    <dialog id="panel" class="panel" aria-labelledby="panel-title"><div id="panel-content"></div></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
